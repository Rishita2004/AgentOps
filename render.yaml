databases:
  - name: agent-ops-db
    plan: free
    databaseName: commerce
    user: relay

services:
  - type: web
    name: agent-ops
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agent-ops-db
          property: connectionString
        # Render gives psycopg2-style URL; we rewrite in the app
      - key: AGENT_DB_PASSWORD
        generateValue: true
      - key: AGENT_DB_URL
        # Set manually after first deploy (uses the agent_ro role created on startup)
        value: placeholder
      - key: SESSION_SECRET
        generateValue: true
      - key: SELLER_ACCESS_CODE
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false  # optional, set in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: MAX_RUNS_PER_HOUR
        value: "20"
      - key: PYTHON_VERSION
        value: "3.13"
